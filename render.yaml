services:
  - type: web
    name: blockmate
    runtime: node
    plan: starter
    region: frankfurt
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /healthz
    numInstances: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: PUBLIC_URL
        value: https://www.dbcblockmate.com
      - key: DB_FILE
        value: /data/blockmate.db
      - key: ADMIN_KEY
        generateValue: true
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
    disk:
      name: data
      mountPath: /data
      sizeGB: 1
